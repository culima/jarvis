<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Ask Jarvis</title>
<style>
  :root { --c: #a06bff; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 16px "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .bar { position: absolute; inset: 10px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: rgba(7, 8, 12, 0.92); border: 1px solid var(--c);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); box-shadow: inset 0 0 24px color-mix(in srgb, var(--c) 22%, transparent); }
  .tick { width: 10px; height: 10px; background: var(--c); transform: rotate(45deg); box-shadow: 0 0 10px var(--c); flex: none; }
  input { flex: 1; background: transparent; border: 0; outline: 0; color: #f1eefc; font: inherit; caret-color: var(--c); }
  input::placeholder { color: #6f6c85; }
  kbd { color: #6f6c85; font: 12px inherit; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="bar"><i class="tick" aria-hidden="true"></i><input id="q" type="text" placeholder="Ask Jarvis…" aria-label="Ask Jarvis" autofocus spellcheck="false"><kbd>ENTER</kbd></div>
<script src="prompt.js"></script>
</body>
</html>
